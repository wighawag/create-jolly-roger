name: Sync template from jolly-roger

# Polls jolly-roger's main branch every 30 minutes and, when the template
# has changed, bumps the version, commits, pushes, and publishes to npm.
# Can also be triggered manually from the Actions tab.
#
# Required secret (configure in create-jolly-roger repo settings → Secrets):
#   NPM_TOKEN  – an npm access token with publish rights for create-jolly-roger

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (only used if template changed)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync & publish

    steps:
      - name: Checkout jolly-roger (main)
        uses: actions/checkout@v5
        with:
          repository: wighawag/jolly-roger
          ref: main
          path: jolly-roger

      - name: Prepare template
        run: |
          # Copy jolly-roger into a clean template directory, excluding
          # generated / runtime / environment-specific files that should
          # not be part of the scaffolded project.
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.svelte-kit' \
            --exclude='artifacts' \
            --exclude='cache' \
            --exclude='generated' \
            --exclude='dist' \
            --exclude='deployments' \
            --exclude='purgatory.db' \
            --exclude='.env.local' \
            --exclude='.env.*.local' \
            --exclude='.nightshift-plan' \
            --exclude='.kilo' \
            --exclude='.vscode' \
            --exclude='tmp' \
            --exclude='yalc.lock' \
            --exclude='.yalc' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            --exclude='static/pwa' \
            --exclude='coverage' \
            --exclude='_metadata' \
            --exclude='pnpm-lock.yaml' \
            jolly-roger/ /tmp/template/

      - name: Checkout create-jolly-roger
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update template and check for changes
        id: changes
        run: |
          rm -rf template
          cp -a /tmp/template template
          if git diff --exit-code --quiet; then
            echo 'changed=false' >> $GITHUB_OUTPUT
            echo 'No template changes detected.'
          else
            echo 'changed=true' >> $GITHUB_OUTPUT
          fi

      - name: Bump version, commit, push, and publish
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Determine version bump type (default: patch for scheduled runs)
          VERSION_BUMP='${{ github.event.inputs.version }}'
          if [ -z "$VERSION_BUMP" ]; then
            VERSION_BUMP='patch'
          fi

          # Bump version
          npm version "$VERSION_BUMP" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          # Commit and tag
          JOLLY_ROGER_SHA=$(cd ../jolly-roger && git rev-parse --short HEAD)
          git add -A
          git commit -m "chore: sync template from jolly-roger@$JOLLY_ROGER_SHA"
          git tag "v$NEW_VERSION"
          git push
          git push --tags

          # Publish to npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}